<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Layered lowering and observation</title>
<desc id="desc">L0 scene data lowers through an L1 graph and pure L2 contracts into interchangeable L3 backends; retained outputs feed shell, capture, and inspection.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#687672"/></marker></defs>
<rect width="1000" height="350" rx="12" fill="#f4efe4"/>
<path d="M 205 65.0 C 233 65.0, 217 65.0, 245 65.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="225.0" y="58.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">lower</text>
<path d="M 425 65.0 C 453 65.0, 437 65.0, 465 65.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="445.0" y="58.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">compile</text>
<path d="M 645 65.0 C 673 65.0, 657 65.0, 685 65.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="665.0" y="58.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">lower</text>
<path d="M 865 65.0 C 901 281.0, 649 281.0, 685 209.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="775.0" y="130.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">retain</text>
<path d="M 865 209.0 C 901 281.0, 429 281.0, 465 209.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="665.0" y="202.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">cook</text>
<path d="M 865 209.0 C 901 281.0, 209 281.0, 245 209.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="555.0" y="202.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">project</text>
<path d="M 425 209.0 C 453 209.0, 437 209.0, 465 209.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="445.0" y="202.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">inspect</text>
<g id="l0" transform="translate(25 34)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d97928" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d97928"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L0 · Scene data</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">strict EDN → typed Scene</text>
</g>
<g id="l1" transform="translate(245 34)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#168da0" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#168da0"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L1 · Pass graph</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">typed DAG, delays, cache</text>
</g>
<g id="l2" transform="translate(465 34)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#3c75aa" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#3c75aa"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L2 · Pure contracts</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">trace / propose / shift / evaluate</text>
</g>
<g id="l3" transform="translate(685 34)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d02a91" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d02a91"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L3 · Backends</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">scalar · Taichi · Slang</text>
</g>
<g id="outputs" transform="translate(685 178)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#64766f" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#64766f"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Retained outputs</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">SoA buffers + compact lineage</text>
</g>
<g id="shell" transform="translate(465 178)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d97928" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d97928"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Imperative shell</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">CLI · UI · capture · persistence</text>
</g>
<g id="record" transform="translate(245 178)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#168da0" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#168da0"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Proof record</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">replay, path tree, Viewport C</text>
</g>
<text x="18" y="336" fill="#687672" font-family="ui-monospace,monospace" font-size="11">2D domain → layer-map</text>
</svg>
