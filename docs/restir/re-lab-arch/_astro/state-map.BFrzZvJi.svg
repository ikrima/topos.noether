<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Address, freeze, gather, commit</title>
<desc id="desc">Counter-addressed fresh samples combine with prior-frame history, freeze into an immutable same-frame source, gather spatial neighbors, then commit final state.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#687672"/></marker></defs>
<rect width="1000" height="350" rx="12" fill="#f4efe4"/>
<path d="M 198 135.0 C 226 135.0, 182 135.0, 210 135.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="204.0" y="128.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">address</text>
<path d="M 390 135.0 C 418 135.0, 374 135.0, 402 135.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="396.0" y="128.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">candidate</text>
<path d="M 582 49.0 C 618 207.0, 366 207.0, 402 135.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="492.0" y="85.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">delayed</text>
<path d="M 582 135.0 C 610 135.0, 566 135.0, 594 135.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="588.0" y="128.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">snapshot</text>
<path d="M 774 135.0 C 802 135.0, 758 135.0, 786 135.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="780.0" y="128.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">self/source</text>
<path d="M 774 249.0 C 802 249.0, 758 135.0, 786 135.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="780.0" y="185.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">gather</text>
<path d="M 966 135.0 C 1002 321.0, 750 321.0, 786 249.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="876.0" y="185.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">own pixel</text>
<path d="M 966 249.0 C 1002 321.0, 366 321.0, 402 49.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="684.0" y="142.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">next frame</text>
<g id="rng" transform="translate(18 104)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d97928" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d97928"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Counter RNG</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">pixel · sample · frame · bounce · stream</text>
</g>
<g id="fresh" transform="translate(210 104)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#168da0" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#168da0"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Fresh proposals</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">thread owns its pixel</text>
</g>
<g id="history" transform="translate(402 18)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#3c75aa" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#3c75aa"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Frame n−1</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">reproject + M-clamp</text>
</g>
<g id="temporal" transform="translate(402 104)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d02a91" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d02a91"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Temporal combine</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">aggregate candidate</text>
</g>
<g id="freeze" transform="translate(594 104)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#64766f" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#64766f"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Immutable ping</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">post-temporal source</text>
</g>
<g id="neighbors" transform="translate(594 218)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d97928" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d97928"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Same-frame neighbors</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">read-only deterministic fan</text>
</g>
<g id="spatial" transform="translate(786 104)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#168da0" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#168da0"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Spatial combine</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">read many · write self</text>
</g>
<g id="commit" transform="translate(786 218)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#3c75aa" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#3c75aa"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Final + delay commit</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">transaction after terminals</text>
</g>
<text x="18" y="336" fill="#687672" font-family="ui-monospace,monospace" font-size="11">4D domain → spatiotemporal-lineage</text>
</svg>
