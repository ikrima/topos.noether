<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">The proof-carrying pixel loop</title>
<desc id="desc">The scalar oracle produces a typed record and exact pixel replay; accelerated backends are compared against it, and the same record drives inspection without extra work.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#687672"/></marker></defs>
<rect width="1000" height="350" rx="12" fill="#f4efe4"/>
<path d="M 200 135.0 C 228 135.0, 192 65.0, 220 65.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="210.0" y="93.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">replay</text>
<path d="M 200 135.0 C 228 135.0, 192 215.0, 220 215.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="210.0" y="168.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">render</text>
<path d="M 400 65.0 C 428 65.0, 412 65.0, 440 65.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="420.0" y="58.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">record decisions</text>
<path d="M 400 65.0 C 428 65.0, 412 215.0, 440 215.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="420.0" y="133.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">oracle</text>
<path d="M 400 215.0 C 428 215.0, 412 215.0, 440 215.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="420.0" y="208.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">compare</text>
<path d="M 620 65.0 C 648 65.0, 652 65.0, 680 65.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="650.0" y="58.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">fold</text>
<path d="M 860 65.0 C 896 287.0, 644 287.0, 680 215.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="770.0" y="133.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">explain</text>
<path d="M 620 215.0 C 648 215.0, 652 215.0, 680 215.0" fill="none" stroke="#687672" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="650.0" y="208.0" text-anchor="middle" fill="#687672" font-family="ui-monospace,monospace" font-size="10">validate</text>
<g id="key" transform="translate(20 104)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d97928" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d97928"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Selected RNG key</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">exact pixel/sample/frame</text>
</g>
<g id="scalar" transform="translate(220 34)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#168da0" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#168da0"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Scalar oracle</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">readable, independent math</text>
</g>
<g id="fast" transform="translate(220 184)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#3c75aa" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#3c75aa"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Taichi / Slang</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">SoA/native lowering</text>
</g>
<g id="diff" transform="translate(440 184)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d02a91" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d02a91"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Differential tests</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">discrete exact · float tolerance</text>
</g>
<g id="record" transform="translate(440 34)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#64766f" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#64766f"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Typed replay record</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">decisions, failures, lineage, work</text>
</g>
<g id="views" transform="translate(680 34)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#d97928" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#d97928"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Maps and territory</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">tree · chart · 3D · capture</text>
</g>
<g id="claim" transform="translate(680 184)">
<rect width="180" height="62" rx="7" fill="#fffdf7" stroke="#168da0" stroke-width="2"/>
<rect width="5" height="62" rx="3" fill="#168da0"/>
<text x="14" y="24" fill="#202827" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Evidence-backed claim</text>
<text x="14" y="44" fill="#5a6864" font-family="system-ui,sans-serif" font-size="10.5">image + state + explanation</text>
</g>
<text x="18" y="336" fill="#687672" font-family="ui-monospace,monospace" font-size="11">3D domain → evidence-loop</text>
</svg>
